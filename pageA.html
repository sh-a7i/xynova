<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Loading...</title>
  <meta http-equiv="refresh" content="1; url=PAGE_B_URL">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 120px;
    }
    .loader {
      border: 6px solid #f3f3f3;
      border-top: 6px solid #555;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      margin: 20px auto;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <h2>Please wait...</h2>
  <div class="loader"></div>
  <p>Connecting securely...</p>
</body>
</html>
